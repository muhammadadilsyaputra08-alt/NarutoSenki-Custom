name: build-debug

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/NarutoSenki/**'
      - 'cocos2dx/**'
      - 'CocosDenshion/**'
      - 'extensions/**'
      - 'scripting/**'
      - 'external/**'
      - '.github/workflows/build-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cmdline-tools 12.x (pulled by android-actions/setup-android@v3) requires
      # JDK 17+ to run sdkmanager itself. Use JDK 17 here only for SDK/NDK
      # provisioning; switched back to JDK 8 below before Gradle runs, since
      # AGP 3.3.3 (pinned in build.gradle) requires JDK 8.
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Android SDK (compileSdk 31 / buildTools 31.0.0, matches app/build.gradle
      # and libcocos2dx/build.gradle). NDK pinned to r21e: last NDK line that
      # reliably supports legacy ndk-build + GNU Make toolchain files used by
      # cocos2dx's Android.mk/Application.mk. NDK r23+ removed ndk-build
      # GCC-era toolchain shims; r18+ removed GCC entirely. Since
      # app/build.gradle passes NDK_TOOLCHAIN_VERSION=4.9 (GCC) while
      # Application.mk requests -std=c++2a (unsupported by GCC 4.9), the
      # first CI run is expected to surface exactly this conflict — see
      # note below.
      - uses: android-actions/setup-android@v3

      - name: Install SDK platform / build-tools / NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools" "ndk;21.4.7075529"

      - name: Point Gradle at NDK r21e
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      # Switch back to JDK 8 for the actual Gradle/AGP 3.3.3 build.
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Grant execute to gradlew
        working-directory: projects/NarutoSenki/proj.android-studio
        run: chmod +x gradlew

      - name: assembleDebug
        working-directory: projects/NarutoSenki/proj.android-studio
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Locate APK
        if: always()
        run: find . -name "*.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: narutosenki-debug-apk
          path: '**/*.apk'

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            projects/NarutoSenki/proj.android-studio/app/build/outputs/logs/**
            projects/NarutoSenki/proj.android-studio/**/build.log
